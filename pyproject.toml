[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "texocad"
version = "0.1.0"
description = "TexoCAD Agents"
requires-python = ">=3.12"
dependencies = [
    "azure-data-tables",
    "azure-storage-blob",
    "daytona",
    "deepagents",
    "langchain",
    "langchain-openai",
    "langgraph",
    "langgraph-sdk",
    "openai",
    "pillow",
    "pymupdf",
    "PyJWT[crypto]",
]

[project.optional-dependencies]
dev = [
    "langgraph-api",
    "langgraph-cli[inmem]",
]

[tool.setuptools.packages.find]
include = ["texocad_agents*"]

[tool.setuptools.package-data]
"texocad_agents.cad_agent" = ["prompt/*.md"]
"texocad_agents.lumi_agent" = ["prompt/*.md", "prompt/ring/*.md"]
"texocad_agents.sketch_agent" = ["prompt/*.md"]
